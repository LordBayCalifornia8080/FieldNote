[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldnotes-workspace"
version = "0.1.0"
description = "Self-hosted manuals, living documentation, and reusable checklists"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0.36,<2.1",
  "pydantic-settings>=2.7,<3", "argon2-cffi>=23.1,<26", "markdown-it-py>=3,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[project.scripts]
fieldnotes = "fieldnotes.cli:main"

[tool.setuptools.packages.find]
include = ["fieldnotes*"]

[tool.setuptools.package-data]
fieldnotes = ["static/*", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
